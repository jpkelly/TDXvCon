name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest
        env:
          # Tag pushes are releases: also require the packaged toe to
          # contain the current controller and panel source
          # (tests/test_toe_manifest.py, PUBLISHING.md step 3).
          VCON_RELEASE_CHECK: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
